<!doctype html>
<html><head><meta charset="utf-8"><title>brandkit render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
  // Headless entry points used by brandkit.mjs
  let kit;
  window.bk_setup = async (spec) => { kit = kit || new BrandKit(document.getElementById('c')); return await kit.load(spec); };
  window.bk_frame = (t, type, q) => { kit.frame(t); return kit.snap(type || 'image/png', q); };
  window.bk_analyze = async (src, opts) => { kit = kit || new BrandKit(document.getElementById('c')); const L = await kit.logo(src, opts || {}); return { color: L.color, aspect: L.aspect, coverage: L.coverage, keyed: L.keyed, renderer: kit.renderer }; };
</script></body></html>
